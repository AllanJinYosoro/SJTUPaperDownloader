<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SJTU Paper Downloader</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <label class="toggle">
        <input id="headless" type="checkbox" aria-describedby="mode-help">
        <span>后台运行（无头模式）</span>
      </label>
      <p id="mode-help">取消勾选并保存，可打开可见浏览器调试。失败日志和截图保存在项目的 .debug/任务ID/ 目录。</p>
      <div class="actions">
        <button id="save" type="button">Save</button>
        <button id="check" type="button">Check & Start</button>
      </div>
      <p id="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
