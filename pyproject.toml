[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sjtu-paperdownloader"
version = "0.2.0"
description = "SJTU library PDF downloader with Scholar and Zotero integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.50,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.7,<3"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]
captcha = ["onnxruntime>=1.20,<2", "pillow>=11,<13", "numpy>=2,<3"]

[project.scripts]
sjtu-paper = "paperdownloader.cli:main"

[tool.setuptools.packages.find]
include = ["paperdownloader*"]
